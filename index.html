<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Strona główna projektów Imiona i Genealogia.">
  <title>Kotymek — moje projekty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#18312b;--cream:#f4efe4;--paper:#fffaf0;--coral:#e26d5a;--green:#2d6658}
    *{box-sizing:border-box}
    html{background:var(--cream)}
    body{margin:0;color:var(--ink);background:radial-gradient(circle at 12% 8%,rgba(226,109,90,.13),transparent 24rem),radial-gradient(circle at 88% 88%,rgba(45,102,88,.13),transparent 24rem),var(--cream);font-family:Manrope,sans-serif}
    main{min-height:100svh;position:relative;overflow:hidden}
    .page{width:min(1120px,calc(100% - 48px));min-height:100svh;margin:auto;padding:52px 0 30px;display:flex;flex-direction:column;position:relative;z-index:1}
    .intro{max-width:820px;padding:8vh 0 54px}
    .eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 26px;color:var(--green);font-size:.76rem;font-weight:800;letter-spacing:.22em}
    .eyebrow span{width:30px;height:2px;background:var(--coral)}
    h1,h2,p{margin-top:0}
    h1{max-width:760px;margin-bottom:24px;font-family:Fraunces,serif;font-size:clamp(3.2rem,8vw,7rem);font-weight:500;letter-spacing:-.055em;line-height:.92}
    .lead{max-width:580px;margin-bottom:0;color:rgba(24,49,43,.7);font-size:clamp(1rem,1.4vw,1.18rem);line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{min-height:330px;padding:30px;border:1px solid rgba(24,49,43,.14);border-radius:26px;background:rgba(255,250,240,.72);backdrop-filter:blur(12px);box-shadow:0 18px 60px rgba(24,49,43,.06);color:inherit;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;transition:transform .22s ease,box-shadow .22s ease,background .22s ease}
    .card:hover,.card:focus-visible{transform:translateY(-7px);box-shadow:0 28px 70px rgba(24,49,43,.12);outline:none}
    .card.coral:hover,.card.coral:focus-visible{background:#ed8a78}
    .card.green:hover,.card.green:focus-visible{color:var(--paper);background:#397869}
    .card-top{display:flex;align-items:center;justify-content:space-between}
    .number{font-size:.72rem;font-weight:800;letter-spacing:.16em;opacity:.55}
    .arrow{width:48px;height:48px;border:1px solid;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;transition:transform .22s ease}
    .card:hover .arrow,.card:focus-visible .arrow{transform:rotate(45deg)}
    .card h2{margin-bottom:12px;font-family:Fraunces,serif;font-size:clamp(2.4rem,5vw,4.5rem);font-weight:500;letter-spacing:-.04em;line-height:1}
    .card p{max-width:390px;margin-bottom:0;font-size:.96rem;line-height:1.6;opacity:.72}
    .visit{font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    footer{padding-top:32px;display:flex;justify-content:space-between;color:rgba(24,49,43,.52);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .glow{width:380px;height:380px;border:1px solid rgba(24,49,43,.08);border-radius:50%;position:absolute;pointer-events:none}
    .one{top:-210px;right:9%}.two{bottom:-270px;left:-90px}
    @media(max-width:720px){.page{width:min(100% - 28px,520px);padding-top:28px}.intro{padding:7vh 0 38px}h1{font-size:clamp(3rem,15vw,5.4rem)}.grid{grid-template-columns:1fr}.card{min-height:280px;padding:24px}footer span:nth-child(2){display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <div class="glow one"></div><div class="glow two"></div>
    <div class="page">
      <header class="intro">
        <p class="eyebrow"><span></span>KOTYMEK</p>
        <h1>Wybierz, dokąd chcesz zajrzeć.</h1>
        <p class="lead">Wybierz projekt, który chcesz teraz odwiedzić.</p>
      </header>
      <section class="grid" aria-label="Dostępne projekty">
        <a class="card coral" href="https://kotymek.github.io/imiona/">
          <div class="card-top"><span class="number">01</span><span class="arrow" aria-hidden="true">↗</span></div>
          <div><h2>Imiona</h2></div>
          <span class="visit">Otwórz projekt</span>
        </a>
        <a class="card green" href="https://kotymek.github.io/genealogia/">
          <div class="card-top"><span class="number">02</span><span class="arrow" aria-hidden="true">↗</span></div>
          <div><h2>Genealogia</h2></div>
          <span class="visit">Otwórz projekt</span>
        </a>
      </section>
      <footer><span>kotymek.github.io</span><span>✦</span><span>Moje projekty</span></footer>
    </div>
  </main>
</body>
</html>
